<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Compare Custom Element</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #111216;
      }
      video-compare-player {
        display: block;
        width: min(960px, 100%);
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <video-compare-player
      enhanced-src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      original-src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      mode="compare"
      muted
    ></video-compare-player>
    <script src="../dist/index.global.min.js"></script>
    <script>
      VideoCompare.defineVideoComparePlayerElement();
    </script>
  </body>
</html>
